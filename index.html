<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醜照解鎖任務管理器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header id="app-header" class="hidden">
            <div class="user-info">
                <span id="my-uid-display">我的 ID: ----</span>
            </div>
            <div class="coin-display">
                🪙 <span id="coin-count">0</span>
            </div>
        </header>

        <section id="screen-login" class="screen active">
            <div class="login-box">
                <h2>📸 建立你的分身</h2>
                <p>上傳一張醜照，成為別人解鎖的驚喜（嚇）</p>
                <input type="text" id="username-input" placeholder="輸入你的暱稱">
                <div class="upload-area">
                    <label for="photo-upload" class="upload-btn">選擇醜照上傳</label>
                    <input type="file" id="photo-upload" accept="image/*" style="display: none;">
                    <div id="upload-preview" class="preview-box">尚無照片</div>
                </div>
                <button id="btn-register" class="primary-btn">進入系統</button>
            </div>
        </section>

        <section id="screen-tasks" class="screen hidden">
            <div class="input-container">
                <div class="main-input">
                    <input type="text" id="task-name" placeholder="請輸入目標名稱...">
                </div>
                <div class="action-btns">
                    <button id="toggle-btn">▼ 詳細設定</button>
                    <button id="submit-btn">確定飛入</button>
                </div>

                <div class="details-area" id="details-area">
                    <div class="details-row">
                        <label>日期：<input type="date" id="task-date"></label>
                    </div>
                    <div class="details-row">
                        <span class="type-pill selected">報告</span>
                        <span class="type-pill">考試</span>
                        <span class="type-pill">生活</span>
                        <span class="type-pill">其他</span>
                    </div>
                    <div class="matrix-title">重要緊急程度 (將自動決定卡牌顏色)：</div>
                    <div class="matrix-container" id="matrix">
                        <div class="quadrant q1" data-quadrant="重要且緊急">重要且緊急<br><small>(紅色)</small></div>
                        <div class="quadrant q2 selected" data-quadrant="重要不緊急">重要不緊急<br><small>(橘色)</small></div>
                        <div class="quadrant q3" data-quadrant="不重要且緊急">不重要且緊急<br><small>(綠色)</small></div>
                        <div class="quadrant q4" data-quadrant="不重要不緊急">不重要不緊急<br><small>(藍色)</small></div>
                    </div>
                    
                    <div class="notes-container">
                        <textarea id="task-notes" placeholder="填寫備註... (選填)"></textarea>
                    </div>
                </div>
            </div>

            <div class="timeline-wrapper">
                <div class="timeline-track" id="timeline-track">
                    <div class="arrow-line"></div>
                    <div class="arrow-head"></div>
                    </div>
            </div>

            <button id="btn-go-store" class="bottom-btn">🛒 前往暗黑商店</button>
        </section>

        <section id="screen-store" class="screen hidden">
            <button id="btn-back-tasks" class="back-btn">⬅ 返回任務</button>
            <div class="store-box">
                <h2>🕵️‍♂️ 解鎖朋友的醜照</h2>
                <p>每次解鎖需要消耗 <strong>2 枚硬幣</strong></p>
                <input type="text" id="friend-id-input" placeholder="輸入朋友的 ID (例: user_123)">
                <button id="btn-unlock" class="unlock-btn">支付 2 🪙 解鎖！</button>

                <div id="unlock-result" class="result-area hidden">
                    <h3 id="unlocked-name">xxx 的醜照</h3>
                    <img id="unlocked-photo" src="" alt="解鎖的照片">
                </div>
            </div>
        </section>

        <div class="info-panel" id="info-panel">
            <span class="close-btn" id="close-panel">×</span>
            <h3 id="panel-title">任務標題</h3>
            
            <div class="panel-meta">
                <span id="panel-quadrant">重要不緊急</span> | <span id="panel-type">報告</span>
            </div>

            <div class="panel-details-box">
                <p><strong>🕒 截止日期：</strong><span id="panel-date"></span></p>
                <p><strong>⏳ 剩餘天數：</strong><span id="panel-days"></span> 天</p>
                <p><strong>💡 系統滴咕：</strong><span id="panel-quote" class="quote-text"></span></p>
                <div class="panel-notes">
                    <strong>📝 備註：</strong>
                    <div id="panel-notes-content">無</div>
                </div>
            </div>

            <button class="complete-btn" id="task-complete-btn">完成任務 (+1 🪙)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醜照解鎖任務管理器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header id="app-header" class="hidden">
            <div class="user-info">
                <span id="my-uid-display">我的 ID: ----</span>
            </div>
            <div class="header-right">
                <div class="coin-display">🪙 <span id="coin-count">0</span></div>
                <button id="btn-settings" class="icon-btn">⚙️</button>
            </div>
        </header>

        <section id="screen-login" class="screen active">
            <div class="login-box">
                <div class="auth-toggle">
                    <button id="tab-login" class="active">登入</button>
                    <button id="tab-register">註冊</button>
                </div>
                
                <h2 id="auth-title">📸 歡迎回來</h2>
                <p id="auth-subtitle">輸入帳號密碼進入系統</p>

                <input type="text" id="username-input" placeholder="輸入你的帳號 (ID)">
                <input type="password" id="password-input" placeholder="輸入密碼">
                
                <div id="register-fields" class="hidden">
                    <input type="text" id="nickname-input" placeholder="輸入你的對外暱稱">
                    <div class="upload-area">
                        <label for="photo-upload" class="upload-btn">選擇首張醜照上傳</label>
                        <input type="file" id="photo-upload" accept="image/*" style="display: none;">
                        <div id="upload-preview" class="preview-box">尚無照片</div>
                        <input type="text" id="photo-desc-input" placeholder="為這張醜照加上敘述，吸引朋友來買 (必填)">
                    </div>
                </div>

                <button id="btn-auth-submit" class="primary-btn">Let's go!</button>
            </div>
        </section>

        <section id="screen-tasks" class="screen hidden">
            <div class="input-container">
                <div class="main-input">
                    <input type="text" id="task-name" placeholder="請輸入目標名稱...">
                </div>
                <div class="action-btns">
                    <button id="toggle-btn">▼ 詳細設定</button>
                    <button id="submit-btn">確定飛入</button>
                    <button id="cancel-edit-btn" class="hidden">取消修改</button>
                </div>

                <div class="details-area" id="details-area">
                    <div class="details-row">
                        <label>日期：<input type="date" id="task-date"></label>
                    </div>
                    <div class="details-row">
                        <span class="type-pill selected">報告</span>
                        <span class="type-pill">考試</span>
                        <span class="type-pill">生活</span>
                        <span class="type-pill">其他</span>
                    </div>
                    <div class="matrix-title">重要緊急程度：</div>
                    <div class="matrix-container" id="matrix">
                        <div class="quadrant q1" data-quadrant="重要且緊急">重要且緊急</div>
                        <div class="quadrant q2 selected" data-quadrant="重要不緊急">重要不緊急</div>
                        <div class="quadrant q3" data-quadrant="不重要且緊急">不重要且緊急</div>
                        <div class="quadrant q4" data-quadrant="不重要不緊急">不重要不緊急</div>
                    </div>
                    <div class="notes-container">
                        <textarea id="task-notes" placeholder="填寫備註... (選填)"></textarea>
                    </div>
                </div>
            </div>

            <div class="timeline-wrapper">
                <div class="timeline-track" id="timeline-track">
                    <div class="arrow-line"></div>
                    <div class="arrow-head" id="arrow-head"></div>
                </div>
            </div>

            <button id="btn-go-store" class="bottom-btn">🛒 前往暗黑商店</button>
        </section>

        <section id="screen-store" class="screen hidden">
            <button class="back-btn back-to-tasks">⬅ 返回任務</button>
            <div class="store-box">
                <h2>🕵️‍♂️ 搜尋朋友的醜照庫</h2>
                <div class="search-bar">
                    <input type="text" id="friend-id-input" placeholder="輸入朋友帳號 (例: testuser)">
                    <button id="btn-search-friend" class="primary-btn search-btn">搜尋</button>
                </div>

                <div id="store-gallery" class="store-gallery hidden">
                    <h3 id="store-friend-name" class="store-friend-title"></h3>
                    <div class="store-grid" id="store-grid">
                        </div>
                </div>
            </div>
        </section>

        <section id="screen-settings" class="screen hidden">
            <button class="back-btn back-to-tasks">⬅ 返回任務</button>
            <div class="settings-box">
                <h2>⚙️ 個人設定</h2>
                
                <div class="setting-group">
                    <h3>🎨 自訂象限顏色</h3>
                    <div class="color-setting-row"><label>重要且緊急：</label><input type="color" id="color-q1" value="#ef4444"></div>
                    <div class="color-setting-row"><label>重要不緊急：</label><input type="color" id="color-q2" value="#f59e0b"></div>
                    <div class="color-setting-row"><label>不重要且緊急：</label><input type="color" id="color-q3" value="#10b981"></div>
                    <div class="color-setting-row"><label>不重要不緊急：</label><input type="color" id="color-q4" value="#3b82f6"></div>
                    <button id="btn-save-colors" class="secondary-btn">儲存顏色</button>
                </div>

                <div class="setting-group">
                    <h3>📸 擴充我的醜照庫</h3>
                    <p class="setting-hint">上傳照片並附上敘述，吸引朋友解鎖！</p>
                    
                    <div class="upload-area" style="margin-top: 8px;">
                        <label for="extra-photo-upload" class="upload-btn">➕ 選擇新醜照</label>
                        <input type="file" id="extra-photo-upload" accept="image/*" style="display: none;">
                        <div id="extra-upload-preview" class="preview-box">預覽區</div>
                        <input type="text" id="extra-photo-desc" placeholder="輸入照片敘述...">
                        <button id="btn-add-extra-photo" class="primary-btn" style="margin-top: 12px; padding: 10px;">確認新增至圖庫</button>
                    </div>

                    <div class="photo-gallery" id="photo-gallery" style="margin-top: 16px;">
                        </div>
                </div>
            </div>
        </section>

        <div class="info-panel" id="info-panel">
            <span class="close-btn" id="close-panel">×</span>
            <h3 id="panel-title">任務標題</h3>
            <div class="panel-meta">
                <span id="panel-quadrant">重要不緊急</span> | <span id="panel-type">報告</span>
            </div>
            <div class="panel-details-box">
                <p><strong>🕒 截止日期：</strong><span id="panel-date"></span></p>
                <p><strong>⏳ 剩餘天數：</strong><span id="panel-days"></span> 天</p>
                <p><strong>💡 系統滴咕：</strong><span id="panel-quote" class="quote-text"></span></p>
                <div class="panel-notes">
                    <strong>📝 備註：</strong>
                    <div id="panel-notes-content">無</div>
                </div>
            </div>
            
            <div class="panel-actions">
                <button class="edit-btn" id="task-edit-btn">✏️ 修改</button>
                <button class="delete-btn" id="task-delete-btn">🗑️ 刪除</button>
            </div>
            <button class="complete-btn" id="task-complete-btn">完成任務 (+1 🪙)</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>

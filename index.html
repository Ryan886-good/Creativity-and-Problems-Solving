<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPlan Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="web-container">

    <div id="intro-screen" style="display: none;">
        <div class="anim-container">
            <span id="to" class="letter">To</span><span id="p" class="letter">p</span><span id="lan" class="letter">lan</span>
        </div>
    </div>

    <div id="main-app">
        <div class="logo-header">________Toplan</div>
        
        <div class="main-content">
            
            <div id="home-view" class="page-view" style="display: flex;">
                <div class="today-tasks-container">
                    <div class="tasks-header">
                        <h2>今日任務</h2>
                        <button class="add-btn" onclick="openModal('add-modal')">新增 →</button>
                    </div>

                    <div class="task-list" id="task-list"></div>
                </div>

                <div class="section-title">今日時間表：</div>
                <div class="timeline-container">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #555; position: relative; z-index: 2;">
                        <span>8 AM</span><span>10 AM</span><span>12 PM</span><span>2 PM</span><span>4 PM</span><span>6 PM</span>
                    </div>
                    <div class="fake-axis-line">
                        <div id="timeline-blocks"></div>
                    </div>
                </div>
                <div style="height: 30px;"></div>
            </div>

            <div id="learning-view" class="page-view" style="display: none;">
                <div class="back-btn" onclick="switchView('home-view')">＜ 返回主頁</div>
                
                <div class="chart-box">
                    <h3>整週學習紀錄</h3>
                    <div class="chart-area">
                        <div class="chart-y-axis">
                            <span>4(H)</span><span>3</span><span>2</span><span>1</span><span></span>
                        </div>
                        <div class="chart-bars" id="chart-bars">
                            <p style="color:#888; font-size:12px; margin:auto;">尚無紀錄</p>
                        </div>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">每日平均 <strong style="font-size:24px;">0</strong><small> 小時</small></div>
                    <div class="stat-box">上週學習時長 <strong style="font-size:24px;">0</strong><small> 小時</small></div>
                </div>

                <h3 class="section-title">各科目作業考試進度</h3>
                <div class="progress-list" id="progress-list">
                    <p style="color:#888; font-size:12px;">目前無追蹤項目</p>
                </div>
                <div style="height: 30px;"></div>
            </div>

            <div id="more-view" class="page-view" style="display: none;">
                <div class="back-btn" onclick="switchView('home-view')">＜ 返回主頁</div>
                <div class="more-header"><h2>更多功能</h2></div>
                <div class="feature-list">
                    <div class="feature-item" onclick="showNotification('開啟 番茄鐘 功能')"><div class="f-left">🍅 <strong>番茄鐘</strong></div><div class="f-right">﹀</div></div>
                    <div class="feature-item" onclick="showNotification('開啟 讀書音樂 功能')"><div class="f-left">🎧 <strong>讀書音樂</strong></div><div class="f-right">﹀</div></div>
                    <div class="feature-item" onclick="showNotification('開啟 年度報告 功能')"><div class="f-left">📊 <strong>年度報告</strong></div><div class="f-right">﹀</div></div>
                    <div class="feature-item" onclick="showNotification('進入 設定')"><div class="f-left">⚙️ <strong>設定</strong></div><div class="f-right">﹀</div></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="switchView('home-view')"><div class="nav-icon">📋</div><span>行事曆</span></div>
            <div class="nav-item" onclick="switchView('learning-view')"><div class="nav-icon">📖</div><span>學習紀錄</span></div>
            <div class="nav-item" onclick="switchView('more-view')"><div class="nav-icon">≡</div><span>更多功能</span></div>
        </div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal-content add-task-modal">
            <div class="modal-header-box"><h3>新增事項</h3></div>
            <div class="input-gray-box">
                <div class="input-row"><label>事項名稱：</label><input type="text" id="new-task-name"></div>
                <div class="input-row" style="gap: 5px;">
                    <label>時間：</label>
                    <input type="time" id="new-task-start" style="width: 45%;">
                    <span>-</span>
                    <input type="time" id="new-task-end" style="width: 45%;">
                </div>
                <div class="input-row"><label>章節/頁數：</label><input type="text" id="new-task-chapter"></div>
                <div class="input-row"><label>備註：</label><input type="text" id="new-task-memo"></div>
            </div>
            <div class="matrix-grid-container">
                <div class="matrix-axis-y">▲<br>│<br>│<br>│<br>▼</div>
                <div class="matrix-axis-x">◀ ───────── ▶</div>
                <div class="matrix-grid">
                    <button class="quadrant-btn q-imp-nurg" onclick="selectQuadrant(this, 'dot-important')">重要/不緊急</button>
                    <button class="quadrant-btn q-imp-urg" onclick="selectQuadrant(this, 'dot-urgent-important')">重要/緊急</button>
                    <button class="quadrant-btn q-nimp-nurg" onclick="selectQuadrant(this, 'dot-not-urgent')">不重要/不緊急</button>
                    <button class="quadrant-btn q-nimp-urg" onclick="selectQuadrant(this, 'dot-urgent')">不重要/緊急</button>
                </div>
            </div>
            <div class="modal-btns-center">
                <button class="btn-cancel" onclick="closeModal('add-modal')">取消</button>
                <button class="btn-save-gray" onclick="saveTask()">新增 →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content add-task-modal">
            <div class="modal-header-box"><h3 id="edit-modal-title">編輯事項</h3></div>
            <div class="input-gray-box">
                <div class="input-row"><label>事項名稱：</label><input type="text" id="edit-task-name"></div>
                <div class="input-row" style="gap: 5px;">
                    <label>時間：</label>
                    <input type="time" id="edit-task-start" style="width: 45%;">
                    <span>-</span>
                    <input type="time" id="edit-task-end" style="width: 45%;">
                </div>
                <div class="input-row"><label>章節/頁數：</label><input type="text" id="edit-task-chapter"></div>
                <div class="input-row"><label>備註：</label><input type="text" id="edit-task-memo"></div>
            </div>
            <div class="modal-btns-center">
                <button class="btn-delete" onclick="deleteTask()">刪除</button>
                <button class="btn-cancel" onclick="closeModal('edit-modal')">取消</button>
                <button class="btn-save-gray" onclick="confirmEdit()">儲存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="notification-modal">
        <div class="modal-content" style="text-align: center; max-width: 300px;">
            <div style="font-size: 40px; margin-bottom: 10px;">🔔</div>
            <h3 id="notif-title">系統提示</h3>
            <p id="notif-msg" style="color: #555;"></p>
            <div class="modal-btns-center" style="margin-top: 20px;">
                <button class="btn-save-gray" onclick="closeModal('notification-modal')">確認</button>
            </div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
